<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Multimodal Document Vision & HITL Pipeline · Task 3</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            offwhite: {
              DEFAULT: '#faf9f6',
              50: '#fdfdfb',
              100: '#faf9f6',
              200: '#f4f3ee',
              300: '#eae8e0',
              400: '#dbd8cd',
            },
            brand: {
              offwhite: '#faf9f6',
              'offwhite-alt': '#f4f3ee',
              teal: '#0d9488',
              'teal-hover': '#0f766e',
              'teal-soft': 'rgba(13, 148, 136, 0.12)',
              green: '#15803d',
              'green-hover': '#166534',
              'green-soft': 'rgba(22, 163, 74, 0.12)',
              emerald: '#059669',
              'emerald-soft': 'rgba(5, 150, 105, 0.12)'
            }
          }
        }
      }
    };
  </script>

  <!-- Theme init script to avoid flash of wrong theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('app_theme');
        var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body class="app-theme app-bg antialiased flex flex-col min-h-screen text-[var(--color-text)] bg-[var(--color-bg)]">
  <app-root></app-root>
</body>
</html>
